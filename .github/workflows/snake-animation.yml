name: Generate Snake Animation
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ahmedA-gif
          outputs: |
            dist/github-snake.svg?color_snake=00f3ff&color_dots=00f3ff,0d1117,00f3ff,00f3ff,00f3ff
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update Snake Animation" || exit 0
          git push
